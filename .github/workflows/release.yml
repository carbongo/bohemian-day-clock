name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf file
      - name: Rust targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: npm ci
      - run: npm run build
      - run: npm run desktop:package
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: release/*
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: web
          path: public/index.html

  publish:
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Collect files
        run: |
          mkdir out
          cp dist/desktop-*/* out/
          cp dist/web/index.html "out/Bohemian-Day-Clock_${GITHUB_REF_NAME#v}_web.html"
          (cd out && sha256sum * > SHA256SUMS.txt)
          ls -la out
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
